name: Build OVPN30 Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Signed OVPN30 APK
    runs-on: ubuntu-latest

    steps:

      # 1. دریافت سورس OpenVPN XOR
      - name: Checkout OpenVPN XOR
        uses: actions/checkout@v4
        with:
          repository: lawtancool/ics-openvpn-xor
          ref: master
          submodules: recursive
          path: upstream

      # 2. نصب Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. نصب Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      # 4. آماده‌سازی Gradle
      - name: Prepare Gradle
        working-directory: upstream
        run: |
          chmod +x gradlew

          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties <<'EOF'
          icsopenvpnDebugSign=true
          org.gradle.jvmargs=-Xmx4096M
          org.gradle.daemon=false
          EOF

      # 5. نمایش پروژه‌ها
      - name: Show Gradle projects
        working-directory: upstream
        run: |
          ./gradlew projects --stacktrace

      # 6. پیدا کردن Task ساخت APK
      - name: Find Build Task
        working-directory: upstream
        shell: bash
        run: |
          ./gradlew tasks --all --stacktrace > gradle-tasks.txt

          echo "Available assemble tasks:"
          grep -i "assemble" gradle-tasks.txt || true

      # 7. ساخت APK
      - name: Build APK
        working-directory: upstream
        shell: bash
        run: |

          set -e

          TASK=""

          if ./gradlew tasks --all | grep -q "assembleUiOvpn2Release"; then
            TASK="assembleUiOvpn2Release"

          elif ./gradlew tasks --all | grep -q "assembleUiOvpn23Release"; then
            TASK="assembleUiOvpn23Release"

          elif ./gradlew tasks --all | grep -q "assembleOvpn2Release"; then
            TASK="assembleOvpn2Release"

          elif ./gradlew tasks --all | grep -q "assembleRelease"; then
            TASK="assembleRelease"

          elif ./gradlew tasks --all | grep -q "assembleDebug"; then
            TASK="assembleDebug"
          fi

          if [ -z "$TASK" ]; then
            echo "ERROR: No APK build task found."
            exit 1
          fi

          echo "Using build task:"
          echo "$TASK"

          ./gradlew "$TASK" \
            --stacktrace \
            --no-daemon

      # 8. پیدا کردن APK
      - name: Locate APK
        working-directory: upstream
        shell: bash
        run: |

          echo "APK files found:"

          find . \
            -type f \
            -name "*.apk" \
            -print

          mkdir -p ../unsigned

          APK=$(find . \
            -type f \
            -name "*.apk" \
            | grep -E "release|universal" \
            | head -n 1)

          if [ -z "$APK" ]; then
            APK=$(find . \
              -type f \
              -name "*.apk" \
              | head -n 1)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: No APK generated."
            exit 1
          fi

          echo "Selected APK:"
          echo "$APK"

          cp "$APK" ../unsigned/OVPN30-unsigned.apk

      # 9. ساخت Keystore
      - name: Create Signing Keystore
        run: |

          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ovpn30-release.keystore" \
            -alias ovpn30 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "ovpn30password" \
            -keypass "ovpn30password" \
            -dname "CN=OVPN30, OU=OVPN30, O=OVPN30, L=Unknown, ST=Unknown, C=US"

      # 10. پیدا کردن Build Tools
      - name: Prepare APK Tools
        id: apktools
        run: |

          SDK="$ANDROID_HOME"

          ZIPALIGN=$(find "$SDK/build-tools" \
            -name zipalign \
            | sort -V \
            | tail -n 1)

          APKSIGNER=$(find "$SDK/build-tools" \
            -name apksigner \
            | sort -V \
            | tail -n 1)

          if [ -z "$ZIPALIGN" ]; then
            echo "zipalign not found"
            exit 1
          fi

          if [ -z "$APKSIGNER" ]; then
            echo "apksigner not found"
            exit 1
          fi

          echo "ZIPALIGN=$ZIPALIGN" >> "$GITHUB_ENV"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

          echo "zipalign:"
          echo "$ZIPALIGN"

          echo "apksigner:"
          echo "$APKSIGNER"

      # 11. Zipalign
      - name: Zipalign APK
        run: |

          mkdir -p "$GITHUB_WORKSPACE/release"

          "$ZIPALIGN" \
            -f \
            -v \
            4 \
            "$GITHUB_WORKSPACE/unsigned/OVPN30-unsigned.apk" \
            "$GITHUB_WORKSPACE/release/OVPN30-aligned.apk"

      # 12. Sign APK
      - name: Sign APK
        run: |

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/ovpn30-release.keystore" \
            --ks-key-alias ovpn30 \
            --ks-pass pass:ovpn30password \
            --key-pass pass:ovpn30password \
            --out "$GITHUB_WORKSPACE/release/OVPN30-Scramble.apk" \
            "$GITHUB_WORKSPACE/release/OVPN30-aligned.apk"

      # 13. Verify Signature
      - name: Verify APK Signature
        run: |

          echo "======================================"
          echo "VERIFYING APK SIGNATURE"
          echo "======================================"

          "$APKSIGNER" verify \
            --verbose \
            "$GITHUB_WORKSPACE/release/OVPN30-Scramble.apk"

          echo "======================================"
          echo "APK SIGNATURE OK"
          echo "======================================"

      # 14. بررسی APK
      - name: Check APK
        run: |

          echo "======================================"
          echo "FINAL APK"
          echo "======================================"

          ls -lh "$GITHUB_WORKSPACE/release/OVPN30-Scramble.apk"

          unzip -l \
            "$GITHUB_WORKSPACE/release/OVPN30-Scramble.apk" \
            | grep -E "META-INF/.*(RSA|SF)" || true

      # 15. Upload APK
      - name: Upload OVPN30 APK
        uses: actions/upload-artifact@v4
        with:
          name: OVPN30-Scramble-Signed
          path: release/OVPN30-Scramble.apk
          if-no-files-found: error
