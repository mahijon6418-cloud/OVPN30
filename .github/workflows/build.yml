name: Build OVPN30 Signed APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Signed OVPN30 APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. دریافت سورس OpenVPN XOR
      # ==========================================
      - name: Checkout OpenVPN XOR
        uses: actions/checkout@v4
        with:
          repository: lawtancool/ics-openvpn-xor
          ref: master
          submodules: recursive
          path: upstream

      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================
      # 3. Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ==========================================
      # 4. نصب SDK + قبول License
      # ==========================================
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          echo "Accepting Android SDK licenses..."

          yes | sdkmanager --licenses || true

          echo "Installing Android SDK components..."

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK ready."

      # ==========================================
      # 5. آماده سازی Gradle
      # ==========================================
      - name: Prepare Gradle
        working-directory: upstream
        shell: bash
        run: |
          set -e

          chmod +x gradlew

          mkdir -p ~/.gradle

          cat > ~/.gradle/gradle.properties <<'EOF'
          icsopenvpnDebugSign=true
          org.gradle.jvmargs=-Xmx4096M
          org.gradle.daemon=false
          EOF

      # ==========================================
      # 6. نمایش پروژه های Gradle
      # ==========================================
      - name: Show Gradle projects
        working-directory: upstream
        shell: bash
        run: |
          ./gradlew projects --stacktrace

      # ==========================================
      # 7. پیدا کردن Task های APK
      # ==========================================
      - name: Find APK build tasks
        working-directory: upstream
        shell: bash
        run: |
          set -e

          ./gradlew tasks --all --stacktrace > gradle-tasks.txt

          echo "======================================"
          echo "AVAILABLE BUILD TASKS"
          echo "======================================"

          grep -i "assemble" gradle-tasks.txt || true

      # ==========================================
      # 8. Build APK
      # ==========================================
      - name: Build APK
        working-directory: upstream
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR APK BUILD TASK"
          echo "======================================"

          TASK=""

          if ./gradlew tasks --all | grep -q "assembleUiOvpn2Release"; then
            TASK="assembleUiOvpn2Release"

          elif ./gradlew tasks --all | grep -q "assembleUiOvpn23Release"; then
            TASK="assembleUiOvpn23Release"

          elif ./gradlew tasks --all | grep -q "assembleOvpn2Release"; then
            TASK="assembleOvpn2Release"

          elif ./gradlew tasks --all | grep -q "assembleRelease"; then
            TASK="assembleRelease"

          elif ./gradlew tasks --all | grep -q "assembleDebug"; then
            TASK="assembleDebug"
          fi

          if [ -z "$TASK" ]; then
            echo "ERROR: No compatible APK build task found."
            echo ""
            echo "Available assemble tasks:"
            ./gradlew tasks --all | grep -i assemble || true
            exit 1
          fi

          echo "Selected Gradle task:"
          echo "$TASK"

          echo "======================================"
          echo "BUILDING APK"
          echo "======================================"

          ./gradlew "$TASK" \
            --stacktrace \
            --no-daemon

      # ==========================================
      # 9. پیدا کردن APK
      # ==========================================
      - name: Locate APK
        working-directory: upstream
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SEARCHING FOR APK"
          echo "======================================"

          find . \
            -type f \
            -name "*.apk" \
            -print

          mkdir -p ../unsigned

          APK=$(find . \
            -type f \
            -name "*.apk" \
            | grep -E "release|universal" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            APK=$(find . \
              -type f \
              -name "*.apk" \
              | head -n 1 || true)
          fi

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "Selected APK:"
          echo "$APK"

          cp "$APK" ../unsigned/OVPN30-unsigned.apk

          echo "Unsigned APK copied successfully."

      # ==========================================
      # 10. بررسی APK اولیه
      # ==========================================
      - name: Inspect unsigned APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "UNSIGNED APK"
          echo "======================================"

          ls -lh unsigned/OVPN30-unsigned.apk

          file unsigned/OVPN30-unsigned.apk

          unzip -t unsigned/OVPN30-unsigned.apk

      # ==========================================
      # 11. ساخت Keystore
      # ==========================================
      - name: Create signing keystore
        shell: bash
        run: |
          set -e

          echo "Creating OVPN30 signing key..."

          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/ovpn30-release.keystore" \
            -alias ovpn30 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "ovpn30password" \
            -keypass "ovpn30password" \
            -dname "CN=OVPN30, OU=OVPN30, O=OVPN30, L=Unknown, ST=Unknown, C=US"

          echo "Keystore created."

      # ==========================================
      # 12. پیدا کردن zipalign و apksigner
      # ==========================================
      - name: Find APK signing tools
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_HOME"

          ZIPALIGN=$(find "$SDK/build-tools" \
            -type f \
            -name "zipalign" \
            | sort -V \
            | tail -n 1)

          APKSIGNER=$(find "$SDK/build-tools" \
            -type f \
            -name "apksigner" \
            | sort -V \
            | tail -n 1)

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          echo "ZIPALIGN=$ZIPALIGN" >> "$GITHUB_ENV"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"

          echo "zipalign:"
          echo "$ZIPALIGN"

          echo "apksigner:"
          echo "$APKSIGNER"

      # ==========================================
      # 13. Zipalign
      # ==========================================
      - name: Zipalign APK
        shell: bash
        run: |
          set -e

          mkdir -p release

          echo "======================================"
          echo "ZIPALIGN APK"
          echo "======================================"

          "$ZIPALIGN" \
            -f \
            -v \
            4 \
            "$GITHUB_WORKSPACE/unsigned/OVPN30-unsigned.apk" \
            "$GITHUB_WORKSPACE/release/OVPN30-aligned.apk"

          echo "Zipalign completed."

      # ==========================================
      # 14. Sign APK
      # ==========================================
      - name: Sign APK
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "SIGNING APK"
          echo "======================================"

          "$APKSIGNER" sign \
            --ks "$RUNNER_TEMP/ovpn30-release.keystore" \
            --ks-key-alias ovpn30 \
            --ks-pass pass:ovpn30password \
            --key-pass pass:ovpn30password \
            --out "$GITHUB_WORKSPACE/release/OVPN30-Scramble.apk" \
            "$GITHUB_WORKSPACE/release/OVPN30-aligned.apk"

          echo "APK signing completed."

      # ==========================================
      # 15. بررسی امضای APK
      # ==========================================
      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo "VERIFYING APK SIGNATURE"
          echo "======================================"

          "$APKSIGNER" verify \
            --verbose \
            "$GITHUB_WORKSPACE/release/OVPN30-Scramble.apk"

          echo ""
          echo "======================================"
          echo "APK SIGNATURE OK"
          echo "======================================"

      # ==========================================
      # 16. بررسی نهایی APK
      # ==========================================
      - name: Final APK inspection
        shell: bash
        run: |
          set -e

          APK="$GITHUB_WORKSPACE/release/OVPN30-Scramble.apk"

          echo "======================================"
          echo "FINAL APK"
          echo "======================================"

          ls -lh "$APK"

          file "$APK"

          echo ""
          echo "Testing ZIP structure..."

          unzip -t "$APK"

          echo ""
          echo "Signature files:"

          unzip -l "$APK" \
            | grep -E "META-INF/.*(RSA|SF)" || true

          echo ""
          echo "SHA256:"

          sha256sum "$APK"

      # ==========================================
      # 17. آپلود APK
      # ==========================================
      - name: Upload OVPN30 Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: OVPN30-Scramble-Signed
          path: release/OVPN30-Scramble.apk
          if-no-files-found: error
          retention-days: 30
